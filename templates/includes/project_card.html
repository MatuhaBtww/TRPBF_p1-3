<article class="project-card">
  <div class="card-heading"><h2><a href="{{ p.get_absolute_url }}">{{ p.name }}</a></h2><span class="status status-{{ p.status.code }}">{{ p.status.name }}</span></div>
  <div class="project-meta"><span>Ответственный: <a href="{% url 'tracker:developer' p.developer_id %}">{{ p.developer.name }}</a></span><span>Срок: <time datetime="{{ p.deadline|date:'Y-m-d' }}">{{ p.deadline|date:'d.m.Y' }}</time></span></div>
  <div class="tags">{% for t in p.technologies.all %}<span class="tag">{{ t.name }}</span>{% endfor %}</div>
</article>
