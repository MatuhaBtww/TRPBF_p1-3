<div class="table-wrap"><table><caption class="sr-only">Список программных проектов</caption><thead><tr><th>Проект</th><th>Разработчик</th><th>Статус</th><th>Срок</th></tr></thead><tbody>
{% for p in projects %}<tr><td><a href="{% url 'tracker:slug_detail' p.slug %}">{{ p.name }}</a></td><td>{{ p.developer_name }}</td><td>{{ p.status_name }}</td><td>{{ p.deadline|date:'d.m.Y' }}</td></tr>{% empty %}<tr><td colspan="4">Проекты не найдены.</td></tr>{% endfor %}
</tbody></table></div>
