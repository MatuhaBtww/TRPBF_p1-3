{% extends 'base.html' %}{% block content %}<h1>Проекты</h1><form><input name="q" value="{{ request.GET.q }}" placeholder="Поиск"><button>Найти</button></form>{% for p in projects %}<article><h2><a href="{% url 'tracker:detail' p.id %}">{{ p.name }}</a></h2><p>{{ p.developer_name }} · {{ p.status_name }} · {{ p.deadline }}</p></article>{% empty %}<p>Проекты не найдены.</p>{% endfor %}{% endblock %}
